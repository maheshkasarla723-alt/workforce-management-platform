<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>404 - Page Not Found | Workforce Management Platform</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f7fb;
            color: #12395b;
        }
        .card {
            width: min(620px, 100%);
            background: #ffffff;
            border-radius: 14px;
            padding: 42px 34px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(18, 57, 91, 0.12);
            border: 1px solid #e1e8f0;
        }
        .code {
            margin: 0 0 8px;
            font-size: clamp(64px, 12vw, 110px);
            line-height: 1;
            font-weight: 800;
        }
        h1 {
            margin: 0 0 12px;
            font-size: clamp(24px, 4vw, 34px);
        }
        p {
            margin: 0 auto 26px;
            max-width: 470px;
            color: #526273;
            line-height: 1.6;
        }
        .button {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 8px;
            background: #2563eb;
            color: #ffffff;
            text-decoration: none;
            font-weight: 700;
        }
        .button:hover,
        .button:focus-visible {
            background: #1d4ed8;
        }
        .button:focus-visible {
            outline: 3px solid #93c5fd;
            outline-offset: 3px;
        }
    </style>
</head>
<body>
    <main class="card" role="main">
        <p class="code" aria-hidden="true">404</p>
        <h1>Page Not Found</h1>
        <p>
            The page you're looking for does not exist or may have been moved.
        </p>
        <a class="button" href="/">Back to Workforce Management Platform</a>
    </main>
</body>
</html>
