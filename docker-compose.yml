services:

  # ==========================================================
  # POSTGRESQL DATABASE
  # ==========================================================

  postgres:
    image: postgres:16

    container_name: workforce-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: workforce_management

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d workforce_management"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # ==========================================================
  # FASTAPI BACKEND
  # ==========================================================

  backend:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: workforce-backend

    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy

    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/workforce_management

      SECRET_KEY: ${SECRET_KEY}

      ALGORITHM: ${ALGORITHM}

      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES}

    ports:
      - "8000:8000"

    volumes:
      - ./logs:/app/logs


# ============================================================
# DATABASE VOLUME
# ============================================================

volumes:
  postgres_data: